<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="./script.js"></script>
</head>
<body>
    <form action="">
        <label for="curso">Curso:</label>

        <select id="curso">
            <option value="">Selecione</option>
            <option value="info">Técnico em informática</option>
            <option value="tads">Análise e Desenvolvimento de Sistemas</option>
        </select>

        <fieldset id="medio" class="fieldset-cursos">
            <input type="radio" id="1ano" name="medio" value="1">
            <label for="1ano">1&ordm ano</label>
            <input type="radio" id="2ano" name="medio" value="2">
            <label for="2ano">2&ordm ano</label>
            <input type="radio" id="3ano" name="medio" value="3">
            <label for="3ano">3&ordm ano</label>
            <input type="radio" id="4ano" name="medio" value="4">
            <label for="4ano">4&ordm ano</label>
        </fieldset>

        <fieldset id="superior" class="fieldset-cursos">
            <input type="radio" id="1sem" name="superior" value="1">
            <label for="1sem">1&ordm semestre</label>
            <input type="radio" id="2sem" name="superior" value="2">
            <label for="2sem">2&ordm semestre</label>
            <input type="radio" id="3sem" name="superior" value="3">
            <label for="3sem">3&ordm semestre</label>
            <input type="radio" id="4sem" name="superior" value="4">
            <label for="4sem">4&ordm semestre</label>
            <input type="radio" id="5sem" name="superior" value="5">
            <label for="5sem">5&ordm semestre</label>
            <input type="radio" id="6sem" name="superior" value="6">
            <label for="6sem">6&ordm semestre</label>
        </fieldset>
    </form>
</body>
</html>
